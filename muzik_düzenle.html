<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Müzik Düzenle</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <style>

        .duzenleme-sayfasi {
            width: min(600px, 94vw);
            position: relative;
            z-index: 5;
        }

        .duzenleme-karti {
            padding: 35px;
        }

        .duzenleme-baslik {
            text-align: center;
            margin-bottom: 28px;
        }

        .duzenleme-ikon {
            font-size: 50px;
            display: block;
            margin-bottom: 10px;
        }

        .duzenleme-baslik h2 {
            margin: 0 0 8px 0;
            color: #76559b;
            font-family: Georgia, serif;
        }

        .duzenleme-baslik p {
            margin: 0;
            opacity: 0.7;
        }

        .duzenleme-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .duzenleme-form label {
            font-weight: bold;
            margin-top: 8px;
            color: #76559b;
        }

        .kaydet-btn {
            margin-top: 15px;
            width: 100%;
            padding: 14px;
            font-size: 16px;
        }

        .geri-btn {
            display: block;
            text-align: center;
            margin-top: 22px;
        }

        body.dark .duzenleme-baslik h2,
        body.dark .duzenleme-form label {
            color: #f4d98b;
        }

    </style>

</head>


<body>


    <!-- KULLANICI ALANI -->

    <div class="kullanici-alani">

        {% if session.get("kullanici_adi") %}

            <span>
                👋 Hoş geldin, {{ session["kullanici_adi"] }}!
            </span>

            <a href="{{ url_for('cikis') }}">
                🚪 Çıkış Yap
            </a>

        {% endif %}

    </div>


    <!-- BAŞLIK -->

    <h1 class="site-baslik">
        ✏️ Müzik Önerisini Düzenle
    </h1>


    <!-- DÜZENLEME ALANI -->

    <div class="duzenleme-sayfasi">

        <div class="kart duzenleme-karti">


            <div class="duzenleme-baslik">

                <span class="duzenleme-ikon">
                    🎵
                </span>

                <h2>
                    Şarkı Bilgilerini Düzenle
                </h2>

                <p>
                    Şarkının bilgilerini güncelleyebilirsin.
                </p>

            </div>


            <form
                method="POST"
                class="duzenleme-form"
            >


                <label for="sarki_adi">
                    🎵 Şarkı adı
                </label>

                <input
                    id="sarki_adi"
                    type="text"
                    name="sarki_adi"
                    value="{{ muzik[1] }}"
                    placeholder="Şarkı adı"
                    required
                >


                <label for="sanatci">
                    🎤 Sanatçı
                </label>

                <input
                    id="sanatci"
                    type="text"
                    name="sanatci"
                    value="{{ muzik[2] }}"
                    placeholder="Sanatçı"
                    required
                >


                <button
                    type="submit"
                    class="kaydet-btn"
                >
                    💾 Değişiklikleri Kaydet
                </button>


            </form>


            <a
                href="{{ url_for('muzik') }}"
                class="geri-btn"
            >
                ↩️ Vazgeç ve geri dön
            </a>


        </div>

    </div>


</body>

</html>
